<style>
body {
  background-color: black;
  color: white;
  font-size: 20px;
  font-family: system-ui, arial;
}
</style>

<body>
  <form id="form">
  <input id="guess">
  <button id="send">submit</button>
  <span id="result"></span>
  </form>
<script>
  let hiddenNumber = Math.round(Math.random() * 100);
  window.form.onsubmit = (e) => {
    e.preventDefault();
    let guess = +window.guess.value;
    
    window.result.innerText = "Your guess was " + guess + ". It was ";
    if (guess < hiddenNumber) {
      window.result.innerText += " low."
    }
    else if (guess > hiddenNumber) {
      window.result.innerText += " high."
    }
    else {
      window.result.innerText = " right."
      
    }
    
  }
